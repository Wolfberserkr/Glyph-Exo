plugins {
    id 'com.android.application'
}

android {
    namespace 'com.glyphexo.unreadcount'
    compileSdk 35

    defaultConfig {
        applicationId "com.glyphexo.unreadcount"
        minSdk 34
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            // Use debug signing so you can sideload without a keystore
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar'])
}
