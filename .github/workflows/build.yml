name: Build Unread Count APK

on:
  push:
    branches: [main, claude/gifted-meitner-CuY6Q]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Download GlyphMatrix SDK
        run: |
          mkdir -p GlyphCount/app/libs
          curl -sL \
            "https://github.com/Nothing-Developer-Programme/GlyphMatrix-Developer-Kit/archive/refs/heads/main.zip" \
            -o sdk.zip
          # Extract everything, then find the .aar (it lives inside a subdirectory)
          unzip -q sdk.zip -d /tmp/sdk_raw
          AAR=$(find /tmp/sdk_raw -name "*.aar" | head -1)
          if [ -z "$AAR" ]; then
            echo "ERROR: No .aar file found. Repo contents:"
            find /tmp/sdk_raw | head -40
            exit 1
          fi
          cp "$AAR" GlyphCount/app/libs/GlyphMatrixSDK.aar
          echo "SDK: $(ls -lh GlyphCount/app/libs/)"

      - name: Build debug APK
        run: |
          chmod +x GlyphCount/gradlew
          cd GlyphCount && ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnreadCount-debug
          path: GlyphCount/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="GlyphCount/app/build/outputs/apk/debug/app-debug.apk"
          TAG="latest-build"
          gh release delete "$TAG" --yes 2>/dev/null || true
          git push --delete origin "$TAG" 2>/dev/null || true
          cat > /tmp/notes.md << 'EOF'
          ## Install on your Nothing Phone 3
          1. Download app-debug.apk below
          2. Tap to install (allow unknown apps if prompted)
          3. Grant notification access in the app
          4. Open Glyph Toys Manager
          EOF
          gh release create "$TAG" "$APK" \
            --title "Unread Count — latest build" \
            --prerelease \
            --notes-file /tmp/notes.md
